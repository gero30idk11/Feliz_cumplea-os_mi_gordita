<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños! 🎉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Video de fondo -->
    <div class="video-bg">
        <iframe src="https://www.youtube.com/embed/qX_OhpndaTY?autoplay=1&mute=0&loop=1&playlist=qX_OhpndaTY&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1"
            frameborder="0"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>
    <!-- Capa oscura encima del video -->
    <div class="video-overlay"></div>

    <div class="header-container">
        <h1>¡Feliz Cumpleaños! 🎂✨</h1>
    </div>

    <div id="cards-grid" class="cards-grid">
        <div class="loading">Recogiendo las cartas del buzón... 💌</div>
    </div>

    <!-- Modal reproductor -->
    <div id="video-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">✖</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
